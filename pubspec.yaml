name: n_krepted_flutter
description: "Signature Dish - N_Krepted Mobile App"
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  flutter_animate: ^4.5.2
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  path_provider_platform_interface: ^2.1.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Apply the geolocator Always-permission bypass through ios/Podfile.
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  # Only the cut-outs used by the app are bundled.
  assets:
    - assets/img/
    - shorebird.yaml

  # Bundled rather than fetched at runtime: google_fonts downloads on first
  # launch, so the design typefaces showed as system fallbacks until then.
  # Urbanist and Lora are variable (wght axis) — weights are selected with
  # `fontVariations` in AppTextStyles, not by shipping one file per weight.
  fonts:
    - family: KaushanScript
      fonts:
        - asset: assets/fonts/KaushanScript-Regular.ttf
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
